name: BazaarCraft Scout Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin google-genai google-api-python-client

      # STEP 1: RUN THE SHOPPING AGENT ALONE
      - name: Run Shopping Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scout_agent.py

      # STEP 2: PAUSE 60 SECONDS TO RESET GEMINI QUOTA LIMITS
      - name: Cool Down Period
        run: sleep 60

      # STEP 3: RUN THE FOOD AGENT ALONE
      - name: Run Foodcraft Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python food_scout.py
